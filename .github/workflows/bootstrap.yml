name: Bootstrap SyndeoCare platform

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the platform source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload-*.b64 | base64 --decode > /tmp/syndeocare-platform.tar.gz
          tar -xzf /tmp/syndeocare-platform.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml

      - name: Publish the platform source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "syndeocare-platform-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Vercel-first SyndeoCare platform"
          git push origin HEAD:main
